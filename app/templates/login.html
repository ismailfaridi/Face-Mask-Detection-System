{% extends "base.html" %}

{% block content %}
<div class="flex justify-center mt-16 mb-20">
    <div class="glass-card w-full max-w-md p-10 rounded-3xl text-center">
        <h2 class="text-3xl font-bold mb-8">Log in</h2>
        
        <form action="{{ url_for('admin.login') }}" method="POST" class="flex flex-col gap-4">
            <input type="text" name="username" placeholder="Username" required 
                class="w-full px-5 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black transition shadow-sm text-center">
            
            <input type="password" name="password" placeholder="Password" required 
                class="w-full px-5 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black transition shadow-sm text-center mb-4">
            
            <button type="submit" class="w-full bg-black text-white px-8 py-3 rounded-full hover:bg-gray-800 transition transform hover:scale-[1.02] active:scale-[0.98] shadow-lg font-bold">
                Sign in
            </button>
        </form>
    </div>
</div>
{% endblock %}
