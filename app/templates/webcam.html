{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh]">
    <div class="glass-card w-full max-w-4xl p-8 rounded-3xl relative overflow-hidden text-center">
        <h2 class="text-3xl font-bold mb-6">Real-Time Detection</h2>
        <p class="text-gray-500 mb-8">Please ensure your webcam is connected and allow browser permissions.</p>

        <div class="relative inline-block bg-black shadow-2xl rounded-2xl overflow-hidden min-w-[640px] min-h-[480px]">
            <img id="videoFeed" src="{{ url_for('main.video_feed') }}" class="w-full h-auto object-cover rounded-2xl" alt="Webcam Feed">
        </div>
        
        <div class="mt-8">
            <a href="{{ url_for('main.index') }}" class="text-blue-600 hover:text-blue-800 font-medium underline underline-offset-4">Stop & Go Back</a>
        </div>
    </div>
</div>
{% endblock %}
