{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-[70vh]">
    <div class="glass-card w-full max-w-md p-10 rounded-3xl text-center">
        <h2 class="text-3xl font-bold mb-8">Admin Login</h2>
        
        <form action="{{ url_for('admin.login') }}" method="POST" class="flex flex-col gap-4">
            <input type="text" name="username" placeholder="Username" value="admin" required 
                class="w-full px-5 py-3 rounded-full border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-sm shadow-sm">
            
            <input type="password" name="password" placeholder="Password" value="admin" required 
                class="w-full px-5 py-3 rounded-full border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-sm shadow-sm mb-2">
            
            <button type="submit" class="w-full bg-black text-white px-8 py-3 rounded-full hover:bg-gray-800 hover:shadow-md transition transform active:scale-95 font-bold text-lg">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
