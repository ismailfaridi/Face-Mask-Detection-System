{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[70vh]">
    <div class="glass-card w-full max-w-4xl p-8 rounded-3xl text-center">
        <h2 class="text-3xl font-bold mb-6">Real-Time Detection</h2>
        <p class="text-gray-600 mb-8">Ensure your webcam is connected and allow browser permissions</p>

        <div class="relative inline-block bg-black shadow-2xl rounded-2xl overflow-hidden min-w-[640px]">
            <img id="videoFeed" src="{{ url_for('main.video_feed') }}" class="w-full h-auto object-cover" alt="Webcam Feed">
        </div>
        
        <div class="mt-8">
            <a href="{{ url_for('main.index') }}" class="inline-block bg-black text-white px-6 py-3 rounded-full hover:bg-gray-800 transition font-medium">Stop Detection</a>
        </div>
    </div>
</div>
{% endblock %}
